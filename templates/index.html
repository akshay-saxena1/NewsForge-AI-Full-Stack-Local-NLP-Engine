<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Headline Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Readex Pro', sans-serif;
            background: black;
            margin: 0;
            color: white;
        }

        .hero-title {
            letter-spacing: -0.04em;
            line-height: 0.95;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        // ---------------------------------------------------------
        // 1. HIGHLIGHT EVERYTHING BELOW THIS LINE...
        // ---------------------------------------------------------

        // ...AND PASTE YOUR COPIED v0 CODE RIGHT HERE!
        "use client"
        const { useState } = React;


        function Hero() {
            const [articleText, setArticleText] = useState("")
            const [isGenerating, setIsGenerating] = useState(false)
            const [generatedHeadline, setGeneratedHeadline] = useState("")
            const [error, setError] = useState("")

            const handleGenerate = async () => {
                setIsGenerating(true)
                setError("")
                setGeneratedHeadline("")

                try {
                    const response = await fetch("http://127.0.0.1:8000/generate", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ text: articleText }),
                    })

                    if (!response.ok) {
                        throw new Error("Failed to generate headline")
                    }

                    const data = await response.json()
                    setGeneratedHeadline(data.headline || data.result || JSON.stringify(data))
                } catch (err) {
                    setError(err instanceof Error ? err.message : "An error occurred")
                } finally {
                    setIsGenerating(false)
                }
            }

            return (
                <section className="relative h-screen w-full overflow-hidden bg-black">
                    {/* Background Video */}
                    <video
                        className="absolute inset-0 w-full h-full object-cover"
                        autoPlay
                        loop
                        muted
                        playsInline
                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_063509_7d167302-4fd4-480b-8260-18ab572333d4.mp4"
                    />

                    {/* Navbar */}
                    <nav className="absolute z-20 px-6 md:px-10 pt-6 top-0 left-0 right-0">
                        <div className="flex items-center justify-between gap-4">
                            {/* Left pill - Logo */}
                            <div className="flex items-center gap-2 bg-neutral-900/90 backdrop-blur rounded-full pl-4 pr-6 py-3">
                                <svg
                                    viewBox="0 0 256 256"
                                    className="h-5 w-5"
                                    fill="#ffffff"
                                >
                                    <path d="M 128 192 L 128 256 L 64.5 256 L 32 223 L 0 192 L 0 128 L 64 128 Z M 256 192 L 256 256 L 192.5 256 L 160 223 L 128 192 L 128 128 L 192 128 Z M 128 64 L 128 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 Z M 256 64 L 256 128 L 192.5 128 L 160 95 L 128 64 L 128 0 L 192 0 Z" />
                                </svg>
                                <span className="text-white text-sm font-normal tracking-tight">headliner</span>
                            </div>


                        </div>
                    </nav>

                    {/* Foreground content wrapper */}
                    <div className="relative h-full w-full">
                        {/* Giant staggered headline words */}
                        <h1 className="hero-title absolute text-white font-medium text-[14vw] md:text-[13vw] left-4 md:left-10 top-[18%]">
                            generate
                        </h1>
                        <h1 className="hero-title absolute text-white font-medium text-[14vw] md:text-[13vw] right-4 md:right-10 top-[38%]">
                            ai
                        </h1>
                        <h1 className="hero-title absolute text-white font-medium text-[14vw] md:text-[13vw] left-[18%] md:left-[28%] top-[58%]">
                            headlines
                        </h1>

                        {/* Description paragraph */}
                        <p className="absolute left-6 md:left-10 top-[46%] max-w-[240px] text-[15px] leading-snug text-white/90">
                            transform news articles into striking, publication-ready headlines instantly.
                        </p>

                        {/* Stat block - top right */}
                        <div className="absolute right-6 md:right-24 top-[14%]">
                            <div className="flex items-center gap-3 justify-end">
                                <div className="hidden md:block h-px w-24 bg-white/40 rotate-[20deg]" />
                                <span className="text-4xl md:text-5xl font-medium tracking-tight">+2.5m</span>
                            </div>
                            <p className="text-xs md:text-sm text-white/70 mt-1 text-right">headlines generated</p>
                        </div>

                        {/* Central input area - dark glassmorphism */}
                        <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-2xl z-10">
                            <div className="bg-neutral-900/80 backdrop-blur-xl rounded-2xl p-6 border border-white/10">
                                <textarea
                                    value={articleText}
                                    onChange={(e) => setArticleText(e.target.value)}
                                    placeholder="paste your news article here..."
                                    className="w-full h-32 bg-neutral-800/50 rounded-xl p-4 text-white/90 placeholder:text-white/40 text-sm resize-none focus:outline-none focus:ring-1 focus:ring-white/20 border border-white/5"
                                />
                                <button
                                    onClick={handleGenerate}
                                    disabled={isGenerating || !articleText.trim()}
                                    className="mt-4 w-full py-4 rounded-full bg-white text-black font-medium text-sm hover:bg-neutral-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed relative overflow-hidden group"
                                >
                                    <span className="relative z-10">
                                        {isGenerating ? "generating..." : "generate headline"}
                                    </span>
                                    {/* Glow effect */}
                                    <div className="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <div className="absolute inset-0 bg-gradient-to-r from-white/0 via-white/30 to-white/0 blur-xl" />
                                    </div>
                                </button>

                                {/* Generated Headline Display */}
                                {generatedHeadline && (
                                    <div className="mt-4 p-4 bg-neutral-800/50 rounded-xl border border-white/10">
                                        <p className="text-xs text-white/50 mb-2 uppercase tracking-wider">generated headline</p>
                                        <p className="text-white text-lg font-medium leading-snug">{generatedHeadline}</p>
                                    </div>
                                )}

                                {/* Error Display */}
                                {error && (
                                    <div className="mt-4 p-4 bg-red-900/30 rounded-xl border border-red-500/30">
                                        <p className="text-red-400 text-sm">{error}</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Bottom gradient overlay */}
                        <div className="pointer-events-none absolute bottom-0 left-0 right-0 h-48 bg-gradient-to-b from-transparent to-black" />

                        {/* Stat block - bottom left */}
                        <div className="absolute left-6 md:left-20 bottom-20 md:bottom-24">
                            <div className="flex items-center gap-3">
                                <span className="text-4xl md:text-5xl font-medium tracking-tight">+500k</span>
                                <div className="hidden md:block h-px w-24 bg-white/40 rotate-[-20deg]" />
                            </div>
                            <p className="text-xs md:text-sm text-white/70 mt-1">articles processed</p>
                        </div>

                        {/* Stat block - bottom right */}
                        <div className="absolute right-6 md:right-20 bottom-16 md:bottom-20">
                            <div className="flex items-center gap-3 justify-end">
                                <div className="hidden md:block h-px w-24 bg-white/40 rotate-[-20deg]" />
                                <span className="text-4xl md:text-5xl font-medium tracking-tight">+180k</span>
                            </div>
                            <p className="text-xs md:text-sm text-white/70 mt-1 text-right">active users</p>
                        </div>
                    </div>
                </section>
            )
        }

        // ---------------------------------------------------------
        // 2. MAKE SURE THIS RENDER COMMAND STAYS AT THE VERY BOTTOM!
        // ---------------------------------------------------------
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Hero />); 
    </script>
</body>

</html>
